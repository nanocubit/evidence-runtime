[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-runtime"
version = "0.4.1"
description = "Evidence-first adaptive web extraction runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Evidence Runtime" }]
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.5",
    "duckdb>=0.10",
    "trafilatura>=1.8",
    "extruct>=0.16",
    "w3lib>=2.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "nest_asyncio>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]
browser = [
    "playwright>=1.40",
]
llm = [
    "openai>=1.0",
]

[project.scripts]
eruntime = "evidence_runtime.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["evidence_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
